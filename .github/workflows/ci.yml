name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build libdmview and dmview
        run: |
          mkdir -p build
          cd build
          cmake .. -DDMOD_MODE=DMOD_MODULE
          cmake --build .

      - name: Verify module files
        run: |
          echo "Checking for module files..."
          ls -lh build/dmf/
          test -f build/dmf/libdmview.dmf
          test -f build/dmf/libdmview_version.txt
          test -f build/dmf/dmview.dmf
          test -f build/dmf/test_libdmview.dmf
          echo "Module files present"

      - name: Run libdmview tests with dmod_loader
        run: |
          # Assembles tests/fixtures/*.dmvs with todmv, then runs the test
          bash tests/run_tests.sh $(pwd)/build/dmf tests/fixtures $(pwd)/build/tests/fixtures
