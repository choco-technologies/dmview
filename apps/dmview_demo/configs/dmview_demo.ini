; dmview_demo.ini - libsystemd unit: shows the dmodOS example on the first
; display while it runs (it waits for dmview to register the display).
;
; The view is where dmod-boot embeds the views of the flash modules; give
; another path as the first argument.
description=dmview demo (dmodOS)
exec=dmview_demo
args=/eviews/dmview_demo/dmodos.dmv
type=simple
