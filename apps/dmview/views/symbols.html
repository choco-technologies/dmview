<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Symbols</title>
<link rel="stylesheet" href="fonts/inter.css">
<style>
/*
 * The keyboard of symbols of dmview, for the e-paper of a phone (240 x 212, over the lower part of the display): the characters a small
 * keyboard has no key for, to touch. Black and white only, lines of 1-2 px, text never thinner than 700 (the display has no gray). The font is
 * Inter: the converter makes it in the sizes the page draws, and the firmware has no fonts of its own for a view. A cell that is pressed is
 * inverted (:active). What it says: EMIT char (the character), EMIT close - dmview takes them (apps/dmview/src/main.c).
 */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 240px; height: 212px; background: #fff; color: #000; font-family: 'Inter'; font-weight: 700; overflow: hidden; }
#screen { position: relative; width: 240px; height: 212px; background: #fff; overflow: hidden; }
.rule { position: absolute; left: 0; width: 240px; height: 2px; background: #000; }
#title { position: absolute; left: 12px; top: 6px; font-size: 18px; font-weight: 700; }
#close { position: absolute; right: 8px; top: 3px; width: 78px; height: 26px; border: 2px solid #000; border-radius: 8px; text-align: center; font-size: 15px; line-height: 22px; background: #fff; }
#close:active { background: #000; color: #fff; }
.c { position: absolute; width: 31px; height: 37px; border: 1px solid #000; background: #fff; }
.c:active { background: #000; color: #fff; }
.g { position: absolute; left: 0; top: 4px; width: 29px; text-align: center; font-size: 22px; font-weight: 700; line-height: 1.2; }
</style>
</head>
