; dmview@.ini - libsystemd unit template, one instance per display.
;
; Not started on its own: dmdevfs reports every node that answers
; DMDRVI_IOCTL_GFX_GET_INFO as a "display" class device, and dmview.rules
; maps that class here, so libsystemd instantiates dmview@<name> for each.
;
; %i is the display's name (its node name, e.g. "lcd"), %v its node path
; ("/dev/lcd"). Which view is shown: see dmview's README ("The display
; service") - DMVIEW_VIEWS/<name>.dmv, else DMVIEW_DEFAULT.
description=dmview on display %i
exec=dmview
args=%i %v
type=simple
